[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-invariant-ops"
version = "0.2.0"
description = "Triton/PyTorch operators for batch-invariant robotics inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton"
]
keywords = ["cuda", "determinism", "pytorch", "robotics", "triton", "vla"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort"
]

[project.urls]
Homepage = "https://github.com/yiannisha/robotics-batch-invariant-ops"
Repository = "https://github.com/yiannisha/robotics-batch-invariant-ops.git"
Issues = "https://github.com/yiannisha/robotics-batch-invariant-ops/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["batch_invariant_ops*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
