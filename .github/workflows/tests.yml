name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check batch_invariant_ops scripts test_batch_invariance.py test_investigation_harness.py
      - name: Run CPU-compatible tests
        run: python -m pytest -q test_investigation_harness.py
